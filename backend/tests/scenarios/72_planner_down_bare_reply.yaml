name: planner_down_bare_reply
description: 'conv=60 v1.6: both planner models rate-limited (429 twice) and the customer answers "Yes" to the open colour question — it is answered against that question (the colour question again, with its buttons); never "Sorry, I didn''t quite get that".'
turns:
  - user: "I want 2 kurtis"
    plan: {actions: [{type: add_line, sku: KU10001, variant: {}, qty: 2}]}
    expect: {reply_contains: ["Available: Red, Green, Blue"]}
  - user: "yes"
    plan: {error: "rate limited", status_code: 429}
    repair: [{error: "rate limited", status_code: 429}]
    expect:
      planner_calls: 2
      reply_contains: ["Which colour", "Available: Red, Green, Blue"]
      reply_not_contains: ["didn't quite get that", "trouble"]
      buttons_contain: [v3_opt_1]
      cart: {lines: [{sku: KU10001, color: null, qty: 2}]}
